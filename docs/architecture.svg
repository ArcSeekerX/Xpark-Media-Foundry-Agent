<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Xpark Media Foundry 总体架构</title>
  <desc id="archDesc">Web 体验、编排与智能路由、创作与资产、生成与质检、交付与恢复五层，以及共享基础设施。</desc>
